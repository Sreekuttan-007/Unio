# Local stack: a real MongoDB plus the API. Needs Docker Desktop running.
#   docker compose up --build
services:
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    environment:
      APP_ENV: dev
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: unio
      DEMO_MODE_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - mongo

volumes:
  mongo-data:
